<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>بازی جذاب</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', sans-serif;
      overflow: hidden;
      background: #1a1a2e;
      color: #fff;
    }

    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
    }

    canvas {
      border: 3px solid #e94560;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
      color: #e94560;
    }

    .controls {
      margin-top: 20px;
      display: flex;
      gap: 15px;
    }

    .btn {
      padding: 10px 20px;
      background-color: #e94560;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.3s;
    }

    .btn:hover {
      background-color: #ff6b81;
      transform: scale(1.05);
    }

    .score {
      font-size: 1.5rem;
      margin-bottom: 15px;
    }

    .back-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 8px 15px;
      background-color: #ff0000;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <a href="info.html" class="back-btn">بازگشت</a>
  
  <div class="game-container">
    <h1>بازی مار کلاسیک</h1>
    <div class="score">امتیاز: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="controls">
      <button class="btn" id="startBtn">شروع بازی</button>
      <button class="btn" id="pauseBtn">توقف</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');

    let snake = [{x: 200, y: 200}];
    let food = {x: 0, y: 0};
    let dx = 20;
    let dy = 0;
    let score = 0;
    let gameSpeed = 150;
    let gameInterval;
    let isPaused = false;
    let isGameRunning = false;

    // ایجاد غذا
    function createFood() {
      food.x = Math.floor(Math.random() * canvas.width / 20) * 20;
      food.y = Math.floor(Math.random() * canvas.height / 20) * 20;
      
      // اطمینان از اینکه غذا روی مار قرار نمی‌گیرد
      snake.forEach(segment => {
        if (segment.x === food.x && segment.y === food.y) {
          createFood();
        }
      });
    }

    // شروع بازی
    function startGame() {
      if (isGameRunning) return;
      
      snake = [{x: 200, y: 200}];
      dx = 20;
      dy = 0;
      score = 0;
      scoreElement.textContent = score;
      createFood();
      isGameRunning = true;
      isPaused = false;
      
      if (gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(gameLoop, gameSpeed);
    }

    // حلقه اصلی بازی
    function gameLoop() {
      if (isPaused) return;
      
      moveSnake();
      checkCollision();
      drawGame();
    }

    // حرکت مار
    function moveSnake() {
      const head = {x: snake[0].x + dx, y: snake[0].y + dy};
      snake.unshift(head);
      
      // بررسی برخورد با غذا
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreElement.textContent = score;
        createFood();
      } else {
        snake.pop();
      }
    }

    // بررسی برخورد
    function checkCollision() {
      const head = snake[0];
      
      // برخورد با دیوارها
      if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
        gameOver();
      }
      
      // برخورد با بدن خود
      for (let i = 1; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          gameOver();
        }
      }
    }

    // پایان بازی
    function gameOver() {
      clearInterval(gameInterval);
      isGameRunning = false;
      alert(`بازی تمام شد! امتیاز شما: ${score}`);
    }

    // رسم بازی
    function drawGame() {
      // پاک کردن صفحه
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // رسم مار
      ctx.fillStyle = '#0f3460';
      snake.forEach(segment => {
        ctx.fillRect(segment.x, segment.y, 20, 20);
        ctx.strokeStyle = '#e94560';
        ctx.strokeRect(segment.x, segment.y, 20, 20);
      });
      
      // رسم غذا
      ctx.fillStyle = '#e94560';
      ctx.beginPath();
      ctx.arc(food.x + 10, food.y + 10, 10, 0, Math.PI * 2);
      ctx.fill();
    }

    // کنترل با کیبورد
    document.addEventListener('keydown', e => {
      if (!isGameRunning || isPaused) return;
      
      const key = e.key;
      const goingUp = dy === -20;
      const goingDown = dy === 20;
      const goingRight = dx === 20;
      const goingLeft = dx === -20;
      
      if (key === 'ArrowUp' && !goingDown) {
        dx = 0;
        dy = -20;
      } else if (key === 'ArrowDown' && !goingUp) {
        dx = 0;
        dy = 20;
      } else if (key === 'ArrowLeft' && !goingRight) {
        dx = -20;
        dy = 0;
      } else if (key === 'ArrowRight' && !goingLeft) {
        dx = 20;
        dy = 0;
      }
    });

    // دکمه‌های کنترل
    startBtn.addEventListener('click', startGame);
    
    pauseBtn.addEventListener('click', () => {
      if (!isGameRunning) return;
      
      isPaused = !isPaused;
      pauseBtn.textContent = isPaused ? 'ادامه' : 'توقف';
    });

    // شروع اولیه
    drawGame();
  </script>
</body>
</html>
